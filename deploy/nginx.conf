# nginx: รับการเข้าเว็บทางพอร์ต 80 แล้วส่งต่อให้ Streamlit (127.0.0.1:8501)
# Streamlit ใช้ websocket (/_stcore/stream) จึงต้องมี Upgrade/Connection และ timeout ยาว
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 6m;          # อัปโหลดรูปโปรไฟล์/CSV ได้ไม่เกิน 5MB (ตรงกับ maxUploadSize)

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;     # เชื่อมต่อค้างได้ 24 ชม. (ไม่ตัดหน้าเว็บที่เปิดทิ้งไว้)
        proxy_buffering off;
    }
}
